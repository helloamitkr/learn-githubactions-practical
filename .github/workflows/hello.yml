name: Hello World
on: 
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
        types:
            - closed
jobs:
  hello-world:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Print Hello World
        run: echo "Hello World"
