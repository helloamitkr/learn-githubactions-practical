name: CI pipeline
on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:
jobs:
    lint:
        name: Lint Code Base
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: install dependencies
              run: npm install
            - name: run lint
              run: npm run lint
    test:
        name: Test Code Base
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            - name: install dependencies
              run: npm install
            - name: run test
              run: npm run test